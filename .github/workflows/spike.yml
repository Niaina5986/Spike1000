name: SPIKE1000 Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: spike1000-engine
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Télécharger le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client

      - name: Exécuter Spike1000
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "1089"
          DERIV_SYMBOL: "BOOM1000"
          HISTORY_COUNT: "5000"
          COLLECT_SECONDS: "180"
          FUTURE_TICKS: "20"
        run: |
          python spike.py

      - name: Sauvegarder db.json dans GitHub
        run: |
          git config user.name "Spike1000 Bot"
          git config user.email "spike1000@users.noreply.github.com"

          git add db.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Spike1000 database"
            git push
          else
            echo "Aucune modification à sauvegarder."
          fi
